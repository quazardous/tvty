[package]
name = "tvty-updater"
version = "0.15.0-beta.1"
edition = "2024"
description = "Terminal Velocity Updater: installs and updates Terminal Velocity and aiball"
license = "MIT"
repository = "https://github.com/quazardous/tvty"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tvty-updater"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axoupdater = { version = "0.10", features = ["blocking"] }
gpui-kit = { package = "gpui_ce_kit", git = "https://github.com/gpui-ce/gpui-component", rev = "c082069" }
serde_json = "1"
tvty-config = { path = "../tvty-config" }
tokio = { version = "1", features = ["rt"] }

# Released beside tvty, by dist.
[package.metadata.dist]
dist = true

# Its lines on the console it was started from (`--install`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry"] }

# Terminal Velocity's icon in the .exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
