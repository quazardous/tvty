[package]
name = "tvty"
version = "0.6.0-beta.1"
edition = "2024"
description = "A native terminal for working with many AI agents, their tickets beside"
license = "MIT"
repository = "https://github.com/quazardous/tvty"
homepage = "https://github.com/quazardous/tvty"
readme = "README.md"
keywords = ["terminal", "ai-agents", "claude", "tmux", "gpui"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = ["crates/*"]

[dependencies]
tvty-config = { path = "crates/tvty-config" }
tvty-keys = { path = "crates/tvty-keys" }
# How tvty talks to other processes: aiball, sessions, a second tvty (docs/IPC.md).
tvty-ipc = { path = "crates/tvty-ipc" }
# The updater's engine: the versions, the latest release (not its window).
tvty-updater = { path = "crates/tvty-updater" }
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.22"
env_logger = "0.11.11"
futures = "0.3"
gpui-kit = "0.6"
# Already built for GPUI: only to read an image's size.
image = { version = "0.25", default-features = false }
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Already built for GPUI: to draw colour emoji in the terminals.
swash = "0.2"
# Already built for GPUI: the local time of a step's resume.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = "0.30.0"

# In a debug build, rust-embed reads the kit's icons (the window's minimize,
# maximize and close among them) from the sources of the machine that built
# it: on any other Windows — Windows Sandbox, where the tests run — they are
# blank. Embedded instead, as a release does.
[target.'cfg(windows)'.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }
# Already built for GPUI: a window program still writes to the console it
# was started from (src/main.rs).
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# The Windows programs' icon (assets/tvty.ico), in the .exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Already built for GPUI: draws assets/tvty.ico (examples/windows_icon.rs).
resvg = "0.46"

# Full debug info makes target/debug weigh ~8 GB (GPUI is large). Line tables
# keep backtraces readable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Unoptimised, the dependencies (GPUI, wgpu, alacritty_terminal) draw the
# gallery at about one frame a second: optimise them even in debug builds.
[profile.dev.package."*"]
debug = false
opt-level = 3

# On Windows, a debug GPUI compiles its shaders when it starts, from its
# sources on the machine that built it: that tvty runs nowhere else (not in
# Windows Sandbox, where the Windows tests run). Without debug assertions
# they are compiled at build time and embedded (fxc.exe, the Windows SDK).
[profile.dev.package.gpui-pre-windows]
debug-assertions = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
