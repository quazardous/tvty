[package]
name = "tvty"
version = "0.4.0-beta.1"
edition = "2024"
description = "A native terminal for working with many AI agents, their tickets beside"
license = "MIT"
repository = "https://github.com/quazardous/tvty"
homepage = "https://github.com/quazardous/tvty"
readme = "README.md"
keywords = ["terminal", "ai-agents", "claude", "tmux", "gpui"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = ["crates/*"]

[dependencies]
tvty-config = { path = "crates/tvty-config" }
tvty-keys = { path = "crates/tvty-keys" }
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.22"
env_logger = "0.11.11"
futures = "0.3"
gpui-kit = "0.6"
# Already built for GPUI: only to read an image's size.
image = { version = "0.25", default-features = false }
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Already built for GPUI: to draw colour emoji in the terminals.
swash = "0.2"
# Already built for GPUI: the local time of a step's resume.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = "0.30.0"

# Full debug info makes target/debug weigh ~8 GB (GPUI is large). Line tables
# keep backtraces readable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Unoptimised, the dependencies (GPUI, wgpu, alacritty_terminal) draw the
# gallery at about one frame a second: optimise them even in debug builds.
[profile.dev.package."*"]
debug = false
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
