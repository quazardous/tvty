[package]
name = "tvty"
version = "0.1.0"
edition = "2024"
description = "A native terminal for working with many AI agents, their tickets beside"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
env_logger = "0.11.11"
futures = "0.3"
gpui-kit = "0.6"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Full debug info makes target/debug weigh ~8 GB (GPUI is large). Line tables
# keep backtraces readable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
