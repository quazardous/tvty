# wbox workspace for tvty-egui under GNOME's mutter, headless with its own D-Bus:
# the same app and size as config.yaml, to reproduce what only GNOME shows.
name: tvty-egui-mutter
compositor: mutter
screen: 1280x800
input_backend: hybrid
headless: true
keyboard_layout: us
clipboard_bridge: false
log:
  dir: ./log
  level: info
screenshot_dir: ./screenshots
timeouts:
  app_render: 5
  stop: 20
app:
  command: ./app.sh
