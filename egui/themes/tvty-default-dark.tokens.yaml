# tvty's theme for the egui experiment (docs/EGUI.md). Values come from the
# GPUI build's screenshots in wbox; every string is quoted (an unquoted
# "#colour" is a YAML comment, an unquoted "{alias}" a map).
$description: "tvty's window in the kit's Default Dark: the colours gpui-component gives tvty, measured on its screenshots"
$extends: "pop-dark"
surface:
  $type: "color"
  canvas:
    $value: "#0a0a0a"
    $description: "The window, the panels, the sidebar."
  panel:
    $value: "#0a0a0a"
  sunken:
    $value: "#0a0a0a"
  hover:
    $value: "#1f1f1f"
    $description: "Under the pointer; the title bar's field at rest."
  raised:
    $value: "#151515"
    $description: "A field at rest."
  overlay:
    $value: "#0a0a0a"
text:
  $type: "color"
  default:
    $value: "#fafafa"
  strong:
    $value: "#fafafa"
  muted:
    $value: "#a3a3a3"
border:
  $type: "color"
  default:
    $value: "#262626"
accent:
  $type: "color"
  default:
    $value: "#60a5fa"
    $description: "The theme's blue: tvty's accent."
# GPUI's line around the window, 1 px inside its edges.
window:
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    border-color:
      $type: "color"
      $value: "#333333"
# The title bar: 41 px with its 1 px line, the title right after the app icon.
title-bar:
  $description: "tvty's title bar: the title at the start, muted, a line under the bar."
  height:
    $type: "dimension"
    $value: {value: 41, unit: "px"}
  align:
    $type: "string"
    $value: "start"
  rest:
    fill:
      $type: "color"
      $value: "#141414"
    text:
      $type: "color"
      $value: "{text.muted}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
# GPUI's window buttons: 34 px wide, its kit's glyphs.
window-button:
  width:
    $type: "dimension"
    $value: {value: 34, unit: "px"}
  # GPUI's window glyphs: its kit's icons, 14 px, in the text's colour.
  rest:
    text:
      $type: "color"
      $value: "{text.default}"
    indicator-size:
      $type: "dimension"
      $value: {value: 14, unit: "px"}
window-close:
  width:
    $type: "dimension"
    $value: {value: 34, unit: "px"}
  rest:
    text:
      $type: "color"
      $value: "{text.default}"
    indicator-size:
      $type: "dimension"
      $value: {value: 14, unit: "px"}
glyph:
  $type: "string"
  window-minimize:
    $value: "tvty.window_minimize"
  window-maximize:
    $value: "tvty.window_maximize"
  window-restore:
    $value: "tvty.window_restore"
  window-close:
    $value: "tvty.window_close"
font:
  family:
    $type: "fontFamily"
    ui:
      # What GPUI draws with on Linux (its ".SystemUIFont"): the first
      # installed font of its fallback stack, in its order (Adwaita Sans on
      # GNOME 47, DejaVu Sans on a bare box). Then, for the glyphs it
      # lacks (the full list's ⤢), cosmic-text's own fallbacks, then
      # FreeSerif, where a box without them falls back.
      $value: ["Helvetica", "Segoe UI", "Ubuntu", "Adwaita Sans", "Cantarell", "Noto Sans", "DejaVu Sans", "Arial", "FreeSans", "Noto Sans Symbols", "Noto Sans Symbols2", "FreeSerif", "sans-serif"]
  size:
    $type: "dimension"
    small:
      $value: {value: 12, unit: "px"}
    body:
      $value: {value: 14, unit: "px"}
    heading:
      $value: {value: 16, unit: "px"}
# The tip card: the window's surface, a line in the tips' violet at 60 %.
tip-card:
  padding-x:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.canvas}"
    border-color:
      $type: "color"
      $value: "#bd8bee99"
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
tvty:
  $description: "tvty's own tokens, read by path."
  tip:
    $type: "color"
    fill:
      $value: "#bd8bee"
      $description: "The tips' violet (not the accent's blue, which says other things)."
    text:
      $value: "#141414"
      $description: "Text on the tips' violet."
  text:
    $type: "dimension"
    xs:
      $value: {value: 12, unit: "px"}
    sm:
      $value: {value: 14, unit: "px"}
    base:
      $value: {value: 16, unit: "px"}
    lg:
      $value: {value: 18, unit: "px"}
# The folded side bar: a 15 px strip, its grip drawn by the DragHandle glyph.
area-strip:
  width:
    $type: "dimension"
    $value: {value: 15, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.canvas}"
    text:
      $type: "color"
      $value: "#474747"
# The pill on the sash between areas: 6 x 44, 4.5 px inside the edge.
area-grip:
  width:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  height:
    $type: "dimension"
    $value: {value: 44, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    radius:
      $type: "dimension"
      $value: {value: 3, unit: "px"}
  offset:
    $type: "dimension"
    $value: {value: 4.5, unit: "px"}
# No separator line along the side areas (GPUI draws none), no margin
# inside them: each panel lays itself out to the edges.
side-area:
  padding-x:
    $type: "dimension"
    $value: {value: 0, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 0, unit: "px"}
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
