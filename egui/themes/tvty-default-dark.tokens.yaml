# tvty's theme for the egui experiment (docs/EGUI.md). Values come from the
# GPUI build's screenshots in wbox; every string is quoted (an unquoted
# "#colour" is a YAML comment, an unquoted "{alias}" a map).
$description: "tvty's window in the kit's Default Dark: the colours gpui-component gives tvty, measured on its screenshots"
$extends: "pop-dark"
surface:
  $type: "color"
  canvas:
    $value: "#0a0a0a"
    $description: "The window, the panels, the sidebar."
  panel:
    $value: "#0a0a0a"
  sunken:
    $value: "#0a0a0a"
  hover:
    $value: "#1f1f1f"
    $description: "Under the pointer; the title bar's field at rest."
  raised:
    $value: "#151515"
    $description: "A field at rest."
  overlay:
    $value: "#0a0a0a"
text:
  $type: "color"
  default:
    $value: "#fafafa"
  strong:
    $value: "#fafafa"
  muted:
    $value: "#a3a3a3"
border:
  $type: "color"
  default:
    $value: "#262626"
accent:
  $type: "color"
  default:
    $value: "#60a5fa"
    $description: "The theme's blue: tvty's accent."
# GPUI's line around the window, 1 px inside its edges.
window:
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    border-color:
      $type: "color"
      $value: "#333333"
# The title bar: 41 px with its 1 px line, the title right after the app icon.
title-bar:
  $description: "tvty's title bar: the title at the start, muted, a line under the bar."
  height:
    $type: "dimension"
    $value: {value: 41, unit: "px"}
  align:
    $type: "string"
    $value: "start"
  rest:
    fill:
      $type: "color"
      $value: "#141414"
    text:
      $type: "color"
      $value: "{text.muted}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
# GPUI's window buttons: 34 px wide, its kit's glyphs.
window-button:
  width:
    $type: "dimension"
    $value: {value: 34, unit: "px"}
  # GPUI's window glyphs: its kit's icons, 14 px, in the text's colour.
  rest:
    text:
      $type: "color"
      $value: "{text.default}"
    indicator-size:
      $type: "dimension"
      $value: {value: 14, unit: "px"}
window-close:
  width:
    $type: "dimension"
    $value: {value: 34, unit: "px"}
  rest:
    text:
      $type: "color"
      $value: "{text.default}"
    indicator-size:
      $type: "dimension"
      $value: {value: 14, unit: "px"}
glyph:
  $type: "string"
  # GPUI's selects end on a chevron, not egui's triangle.
  dropdown:
    $value: "chevron-down"
  window-minimize:
    $value: "tvty.window_minimize"
  window-maximize:
    $value: "tvty.window_maximize"
  window-restore:
    $value: "tvty.window_restore"
  window-close:
    $value: "tvty.window_close"
font:
  family:
    $type: "fontFamily"
    ui:
      # What GPUI draws with on Linux (its ".SystemUIFont"): the first
      # installed font of its fallback stack, in its order (Adwaita Sans on
      # GNOME 47, DejaVu Sans on a bare box). Then, for the glyphs it
      # lacks (the full list's ⤢), cosmic-text's own fallbacks, then
      # FreeSerif, where a box without them falls back.
      $value: ["Helvetica", "Segoe UI", "Adwaita Sans", "Cantarell", "Noto Sans", "DejaVu Sans", "Arial", "FreeSans", "Noto Sans Symbols", "Noto Sans Symbols2", "FreeSerif", "sans-serif"]
  size:
    $type: "dimension"
    small:
      $value: {value: 12, unit: "px"}
    body:
      $value: {value: 14, unit: "px"}
    heading:
      $value: {value: 16, unit: "px"}
  # gpui-component's text (the title, menus' entries): 14 px. egui-pop's
  # menus lay their labels, keys and notes in egui's Body style.
  text-style:
    $type: "dimension"
    body:
      $value: {value: 14, unit: "px"}
# The tip card: the window's surface, a line in the tips' violet at 60 %.
tip-card:
  padding-x:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.canvas}"
    border-color:
      $type: "color"
      $value: "#bd8bee99"
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
tvty:
  $description: "tvty's own tokens, read by path."
  tip:
    $type: "color"
    fill:
      $value: "#bd8bee"
      $description: "The tips' violet (not the accent's blue, which says other things)."
    text:
      $value: "#141414"
      $description: "Text on the tips' violet."
  text:
    $type: "dimension"
    xs:
      $value: {value: 12, unit: "px"}
    sm:
      $value: {value: 14, unit: "px"}
    base:
      $value: {value: 16, unit: "px"}
    lg:
      $value: {value: 18, unit: "px"}
# The folded side bar: a 15 px strip, its grip drawn by the DragHandle glyph.
area-strip:
  # GPUI's strip: 14 inside the window's outline, its edge line included.
  width:
    $type: "dimension"
    $value: {value: 14, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.canvas}"
    text:
      $type: "color"
      $value: "#474747"
# The pill on the sash between areas: 6 x 44, 4.5 px inside the edge.
area-grip:
  width:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  height:
    $type: "dimension"
    $value: {value: 44, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    radius:
      $type: "dimension"
      $value: {value: 3, unit: "px"}
  offset:
    $type: "dimension"
    $value: {value: 4.5, unit: "px"}
# No separator line along the side areas (GPUI draws none), no margin
# inside them: each panel lays itself out to the edges.
side-area:
  # GPUI's sessions list lies over the centre without a shadow to see.
  shadow-color:
    $type: "color"
    $value: "{transparent}"
  padding-x:
    $type: "dimension"
    $value: {value: 0, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 0, unit: "px"}
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
  # Nor while the sash is hovered or dragged: GPUI shows only its grip.
  hover:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
  active:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
# The kit's status colours, as gpui-component's dark theme has them.
danger:
  $type: "color"
  $value: "#f87171"
warning:
  $type: "color"
  $value: "#facc15"
success:
  $type: "color"
  $value: "#4ade80"
info:
  $type: "color"
  $value: "#22d3ee"
# The full list's boxes, as the GPUI build draws them.
indicator-badge:
  $description: "What tickets ask of the user (the critical one, decisions, unread): GPUI's pill, 6 from its sides, the line box of its small text, dark ink on its colour."
  height:
    $type: "dimension"
    $value: {value: 19, unit: "px"}
  padding-x:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  font-size:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  rest:
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "#141414"
selectable-row:
  $description: "The full list's choices: the chosen one on the selection's blue, a light fill under the pointer, no outline."
  rest:
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
  selected:
    fill:
      $type: "color"
      $value: "#0e152b"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
  active:
    fill:
      $type: "color"
      $value: "#0e152b"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
toggle-chip:
  $description: "The full list's filters: a thin outline, the accent's outline on the selection's blue while on."
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
  selected:
    fill:
      $type: "color"
      $value: "#0e152b"
    border-color:
      $type: "color"
      $value: "{accent.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
search-field:
  focus:
    border-color:
      $type: "color"
      $value: "#737373"
    ring-color:
      $type: "color"
      $value: "#3e3e3e"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
list-row:
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
# The sessions list's boxes, as the GPUI build draws them.
tab:
  $description: "The sessions list's tabs: words in the accent's underline when chosen, muted otherwise; no box."
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "{text.muted}"
  selected:
    fill:
      $type: "color"
      $value: "{transparent}"
    text:
      $type: "color"
      $value: "{text.default}"
    indicator-size:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
field:
  rest:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
pill:
  $description: "An agent's counters (b, e): on the hover's grey and muted at zero, lit in their colour with dark ink."
  rest:
    fill:
      $type: "color"
      $value: "#1b1b1b"
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "{text.muted}"
  tone:
    accent:
      fill:
        $type: "color"
        $value: "{accent.default}"
      text:
        $type: "color"
        $value: "#141414"
    info:
      fill:
        $type: "color"
        $value: "{info}"
      text:
        $type: "color"
        $value: "#141414"
# The scroll bars, as gpui-component draws GPUI's: shown at rest, a 6 px
# thumb in #4b4b4b, fully rounded, 4 px from the edge, floating over the
# content, no track.
scroll-bar:
  width:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  width-rest:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  opacity-rest:
    $type: "number"
    $value: 1
  room:
    $type: "dimension"
    $value: {value: 0, unit: "px"}
  margin:
    $type: "dimension"
    $value: {value: 4, unit: "px"}
  # gpui-component keeps 4 px at both ends of the track too.
  margin-track:
    $type: "dimension"
    $value: {value: 4, unit: "px"}
  placement:
    $type: "string"
    $value: "over"
  visibility:
    $type: "string"
    $value: "rest"
  rest:
    fill:
      $type: "color"
      $value: "#4b4b4b"
    radius:
      $type: "dimension"
      $value: {value: 3, unit: "px"}
# The sessions list's sections (LIVE, IDLE, SHUT), as GPUI draws their
# bands: 28 high, a line above and under, 12 from the sides; the mark in
# the accent, 10 wide; the title in capitals, 12 px, at the weight GPUI
# draws (its bold is the variable face's default instance, see row.rs);
# the count on a fully rounded pill of the border's grey, 6 px padding.
text-role:
  section:
    size: {$type: "dimension", $value: {value: 12, unit: "px"}}
    color: {$type: "color", $value: "{text.default}"}
    weight: {$type: "number", $value: 400}
section-band:
  height:
    $type: "dimension"
    $value: {value: 27, unit: "px"}
  padding-x:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  font-size:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  rest:
    border-color:
      $type: "color"
      $value: "{border.default}"
    text:
      $type: "color"
      $value: "{text.default}"
section-disclosure:
  width:
    $type: "dimension"
    $value: {value: 10, unit: "px"}
  rest:
    text:
      $type: "color"
      $value: "{accent.default}"
section-count:
  # Beside the title, 6 apart (space.inline), not at the band's end.
  placement:
    $type: "string"
    $value: "after-title"
  padding-x:
    $type: "dimension"
    $value: {value: 6, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 99, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
# A ticket's detail, as gpui-component draws its parts (measured on GPUI's
# capture): buttons on #151515 with a #2f2f2f line, radius 4; Accept in
# the success tone (#173422, green ink); Reply the primary one, white;
# a disabled one (Reject) on #110d0d with dim ink and no line.
button:
  rest:
    fill:
      $type: "color"
      $value: "#151515"
    border-color:
      $type: "color"
      $value: "#2f2f2f"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
  disabled:
    fill:
      $type: "color"
      $value: "#110d0d"
    border-color:
      $type: "color"
      $value: "#110d0d"
    text:
      $type: "color"
      $value: "#5a5858"
  tone:
    danger:
      fill:
        $type: "color"
        $value: "#3a1f1f"
      border-color:
        $type: "color"
        $value: "#3a1f1f"
      text:
        $type: "color"
        $value: "#f87171"
    success:
      fill:
        $type: "color"
        $value: "#173422"
      border-color:
        $type: "color"
        $value: "#173422"
      text:
        $type: "color"
        $value: "{success}"
    accent:
      fill:
        $type: "color"
        $value: "#fafafa"
      border-color:
        $type: "color"
        $value: "#fafafa"
      text:
        $type: "color"
        $value: "#0a0a0a"
# A plan's options: a 14 px ring, its line barely there at rest; chosen,
# the ring and its dot in the accent.
radio:
  width:
    $type: "dimension"
    $value: {value: 14, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "#191919"
    border-width:
      $type: "dimension"
      $value: {value: 1.5, unit: "px"}
    text:
      $type: "color"
      $value: "{accent.default}"
  selected:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "#385d8a"
    text:
      $type: "color"
      $value: "{accent.default}"
# "Where it stands": a block on #1b1b1b, no line, radius 6.
card:
  rest:
    fill:
      $type: "color"
      $value: "#1b1b1b"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
# A decision's chip: an outline of the border's grey, radius 4; pending,
# filled in the warning's yellow with dark ink.
tag-chip:
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 4, unit: "px"}
    text:
      $type: "color"
      $value: "{text.muted}"
  tone:
    warning:
      fill:
        $type: "color"
        $value: "{warning}"
      border-color:
        $type: "color"
        $value: "{warning}"
      text:
        $type: "color"
        $value: "#0a0a0a"
# A popover (the message to every agent): the window's fill, a line of the
# border's grey, 12 inside, radius 6.
popover:
  padding-x:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 12, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "#0a0a0a"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 6, unit: "px"}
# tvty's menu (its icon, F1), as GPUI draws it: rows 31 apart, labels 12
# from the edge, 336 wide, separators edge to edge, no icon gutter. The
# menu's frame keeps 8 inside its edge and 4 between rows: the numbers
# below are what is left of GPUI's.
menu-item:
  height: {$type: "dimension", $value: {value: 27, unit: "px"}}
  padding-x: {$type: "dimension", $value: {value: 4, unit: "px"}}
  width: {$type: "dimension", $value: {value: 320, unit: "px"}}
  separator-inset: {$type: "dimension", $value: {value: 0, unit: "px"}}
  key-font-size: {$type: "dimension", $value: {value: 12, unit: "px"}}
menu-item-gutter:
  width: {$type: "dimension", $value: {value: 0, unit: "px"}}
# tvty's tooltips, as GPUI draws them: under the pointer, 13 right and 13
# down from it, 29 high with its line, text 8 from the line, the menu's
# frame (#0a0a0a, a #262626 line, radius 6).
tooltip:
  placement: {$type: "string", $value: "pointer"}
  offset: {$type: "dimension", $value: {value: 12, unit: "px"}}
  font-size: {$type: "dimension", $value: {value: 14, unit: "px"}}
  padding-x: {$type: "dimension", $value: {value: 8, unit: "px"}}
  padding-y: {$type: "dimension", $value: {value: 5, unit: "px"}}
  rest:
    fill: {$type: "color", $value: "#0a0a0a"}
    text: {$type: "color", $value: "{text.default}"}
    border-color: {$type: "color", $value: "{border.default}"}
    border-width: {$type: "dimension", $value: {value: 1, unit: "px"}}
    radius: {$type: "dimension", $value: {value: 6, unit: "px"}}
