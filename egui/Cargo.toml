# tvty's window rebuilt on egui-pop, an experiment: how much of tvty's look
# egui-pop lets an application control (docs/EGUI.md). Its own workspace,
# so egui's dependencies never meet GPUI's in tvty's lock file.
[workspace]

[package]
name = "tvty-egui"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The sibling checkout `../egui-pop`, on its tvty branch, as `../aiball` is
# aiball's: egui-pop changes land there as the experiment needs them.
egui-pop = { path = "../../egui-pop/crates/egui-pop", features = ["system-fonts", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
