# tvty's window rebuilt on egui-pop, an experiment: how much of tvty's look
# egui-pop lets an application control (docs/EGUI.md). Its own workspace,
# so egui's dependencies never meet GPUI's in tvty's lock file.
[workspace]

[package]
name = "tvty-egui"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# egui-pop's main at a known commit: moved forward as the gaps the
# experiment finds are closed there.
egui-pop = { git = "https://github.com/quazardous/egui-pop", rev = "c76b8130a998", features = ["system-fonts", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
