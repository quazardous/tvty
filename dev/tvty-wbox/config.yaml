name: tvty-wbox
compositor: labwc
screen: 1280x800
weston_shell: kiosk
weston_backend: x11
input_backend: hybrid
log:
  dir: ./log
  level: info
screenshot_dir: ./screenshots
timeouts:
  wayland_display: 10
  xwayland_display: 15
  app_render: 3
  stop: 10
app:
  # From the repo root, wherever wbox runs from; TVTY_STATS: see docs/TESTING.md.
  command: sh -c 'r=$(git rev-parse --show-toplevel) && TVTY_STATS=$r/dev/tvty-wbox/log/tvty-stats.log exec $r/target/debug/tvty'
  env: {}
tools:
  build:
    script: ./scripts/build.sh
    description: Build tvty (cargo build). Run it between kill and launch.
    headless: true
# Tests copy and paste inside the sandbox: never bridge to the host's clipboard.
clipboard_bridge: false
headless: true
# Tests copy and paste inside the sandbox: never bridge to the host's clipboard.
clipboard_bridge: false
